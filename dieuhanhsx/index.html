<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Điều hành sản xuất PHR</title>
<meta name="robots" content="noindex">
<style>
:root{--pri:#0f766e}
body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:#0f766e;color:#0f172a;padding:16px;box-sizing:border-box}
.c{background:#fff;border-radius:14px;padding:22px;max-width:440px;width:100%;line-height:1.6;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.25)}
a{color:var(--pri);font-weight:700}
</style>
</head>
<body>
<div class="c" id="c">Đang chuyển sang trang Điều hành sản xuất…</div>
<script>
/* Điều hành sản xuất đã chuyển sang kho riêng: https://lttoan79vn-cloud.github.io/dieuhanhsanxuat/ */
const NEW = 'https://lttoan79vn-cloud.github.io/dieuhanhsanxuat/';
try { navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if (/\/dieuhanhsx\/$/.test(r.scope)) r.unregister(); })); } catch (_) { }
fetch('/dieuhanhsanxuat/version.json?t=' + Date.now(), { cache: 'no-store' }).then(r => { if (!r.ok) throw 0; location.replace(NEW + location.hash); })
  .catch(() => { document.getElementById('c').innerHTML = 'Trang Điều hành sản xuất đã chuyển sang địa chỉ mới:<br><a href="' + NEW + '">' + NEW + '</a><br><small>Nếu chưa mở được, Admin cần bật GitHub Pages cho kho <b>dieuhanhsanxuat</b> (Settings › Pages › Branch: main).</small>'; });
</script>
</body>
</html>
