<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Điều hành sản xuất PHR</title>

<style>
:root{--pri:#0f766e;--pri2:#14958a;--pri-d:#0b5f58;--ink:#0f172a;--mut:#64748b;--line:#dfe6ee;--bg:#eef3f1;--card:#fff;--bad:#b42318;--bad-s:#fde8e6;--ok:#13653a;--ok-s:#e7f8ef;--warn:#92400e;--warn-s:#fef3c7}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:"Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);display:flex;flex-direction:column;height:100dvh;overflow:hidden}
[hidden]{display:none!important}
button{font:inherit}
/* thanh trên */
#bar{display:flex;align-items:center;gap:10px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top));background:linear-gradient(90deg,var(--pri),var(--pri2));color:#fff;flex:none;min-width:0}
#bar .lg{display:flex;align-items:center;gap:9px;min-width:0}
#bar .lg img{width:30px;height:30px;border-radius:8px;background:#fff;flex:none}
#bar .t{font-weight:800;font-size:15px;line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bar .t small{display:block;font-weight:500;font-size:11.5px;opacity:.85}
#bar .sp{flex:1}
#chip{font-size:12px;font-weight:700;border-radius:20px;padding:4px 10px;background:rgba(255,255,255,.18);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:34vw}
#chip.ok{background:var(--ok-s);color:var(--ok)}#chip.warn{background:var(--warn-s);color:var(--warn)}
#who{font-size:12.5px;text-align:right;line-height:1.2;white-space:nowrap;max-width:24vw;overflow:hidden;text-overflow:ellipsis}
#who small{display:block;opacity:.85;font-size:11px}
.tb{border:1px solid rgba(255,255,255,.55);background:rgba(255,255,255,.14);color:#fff;border-radius:9px;padding:6px 11px;font-size:13px;font-weight:700;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center;gap:5px}
.tb:hover{background:rgba(255,255,255,.28)}
/* menu chức năng */
#sub{display:flex;gap:1px;flex:none;background:var(--pri-d);overflow-x:auto;scrollbar-width:thin}
#sub button{flex:1 1 0;min-width:150px;border:0;padding:8px 10px;font-size:13.5px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,var(--pri2),var(--pri));color:#fff;white-space:nowrap}
#sub button:hover{background:#17a596}
#sub button.on{background:#fff;color:var(--pri);box-shadow:inset 0 -3px 0 #fbbf24}
#sub .ls{display:none}#bar .ts{display:none}
#upd{flex:none;background:var(--warn-s);color:var(--warn);font-size:13px;padding:7px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#upd button{border:1px solid currentColor;background:#fff;color:inherit;border-radius:8px;padding:3px 10px;font-weight:700;cursor:pointer}
#host{flex:1;display:flex;flex-direction:column;min-height:0;background:#fff}
#frame{flex:1;width:100%;border:0;min-height:0;display:block;background:#fff}
.wait{flex:1;display:grid;place-items:center;color:#475569;font-size:15px;padding:20px;text-align:center;line-height:1.6}
.wait .bx{max-width:540px}
/* đăng nhập */
#login{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:radial-gradient(circle at 20% 10%,#14958a 0,#0f766e 35%,#0b3b37 100%);overflow:auto}
.card{width:100%;max-width:400px;background:var(--card);border-radius:16px;padding:24px 22px;box-shadow:0 18px 50px rgba(0,0,0,.25)}
.card .hd{display:flex;gap:12px;align-items:center;margin-bottom:16px}
.card .hd img{width:46px;height:46px;border-radius:12px}
.card h1{font-size:18px;margin:0;color:var(--pri);line-height:1.25}
.card h1 small{display:block;font-size:12.5px;color:var(--mut);font-weight:500;margin-top:2px}
.fld{display:block;margin-bottom:12px}
.fld span{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:#334155}
.fld input{width:100%;padding:11px 12px;border:1px solid #cbd5e1;border-radius:10px;font:inherit;font-size:15px;background:#fff;color:var(--ink)}
.fld input:focus{outline:2px solid #99d5cd;border-color:var(--pri)}
.btn{width:100%;padding:12px;border:0;border-radius:10px;background:var(--pri);color:#fff;font-weight:800;font-size:15px;cursor:pointer;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:disabled{opacity:.7;cursor:default}
.msg{display:none;margin:0 0 12px;padding:9px 11px;border-radius:9px;background:var(--bad-s);color:var(--bad);font-size:13.5px;line-height:1.5}
.msg.show{display:block}.msg.ok{background:var(--ok-s);color:var(--ok)}
.lnk{margin-top:14px;font-size:13px;color:var(--mut);line-height:1.6;text-align:center}
.lnk a{color:var(--pri);font-weight:700}
.spin{width:16px;height:16px;border:2px solid rgba(255,255,255,.5);border-top-color:#fff;border-radius:50%;animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:#0f172a;color:#fff;padding:9px 14px;border-radius:10px;font-size:13.5px;max-width:90vw;box-shadow:0 6px 20px rgba(0,0,0,.25)}
#toast div.bad{background:var(--bad)}
@media (max-width:1024px){#sub button{min-width:0;font-size:12px;padding:7px 4px}#sub .lf{display:none}#sub .ls{display:inline}}
@media (max-width:760px){
  #bar{gap:6px;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top))}
  #bar .t small,#who,.tb .tx{display:none}
  #bar .t{font-size:13.5px}#bar .lg img{width:26px;height:26px}
  #chip{max-width:40vw;font-size:11px;padding:3px 8px}
  .tb{padding:5px 8px}
  #bar .tl{display:none}#bar .ts{display:inline}
  #chip.ok{font-size:0;padding:4px 7px}#chip.ok::before{content:'☁ Đã đồng bộ';font-size:11px}
}
@media (max-width:420px){#sub button{font-size:11px;padding:7px 1px}}
</style>
</head>
<body>
<div id="bar">
  <div class="lg"><img src="../icon-192.png" alt=""><div class="t"><span class="tl">Điều hành sản xuất</span><span class="ts">Điều hành SX</span><small>Đội xe - Cơ khí - Xưởng PE · PHR</small></div></div>
  <span class="sp"></span>
  <span id="chip">…</span>
  <span id="who"></span>
  <button type="button" class="tb" id="b-reload" title="Tải lại chương trình">↻<span class="tx"> Tải lại</span></button>
  <a class="tb" id="b-phr" href="../" title="Mở chương trình PHR – Hồ sơ đầu tư XDCB">⇱<span class="tx"> PHR</span></a>
  <button type="button" class="tb" id="b-out" title="Đăng xuất">⏻<span class="tx"> Thoát</span></button>
</div>
<div id="sub" role="tablist"></div>
<div id="upd" hidden></div>
<div id="host"><div class="wait">Đang mở chương trình…</div></div>

<div id="login" hidden>
  <form class="card" id="lg-form" autocomplete="on">
    <div class="hd"><img src="../icon-192.png" alt=""><h1>Điều hành sản xuất<small>Đăng nhập bằng tài khoản PHR</small></h1></div>
    <div class="msg" id="lg-msg"></div>
    <label class="fld"><span>Tên đăng nhập hoặc email</span><input id="lg-id" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
    <label class="fld"><span>Mật khẩu</span><input id="lg-pw" type="password" autocomplete="current-password" required></label>
    <button class="btn" id="lg-go" type="submit">Đăng nhập</button>
    <div class="lnk">Dùng chung tài khoản và phân quyền với chương trình PHR.<br>Chưa có tài khoản hoặc quên mật khẩu? <a href="../">Mở PHR</a> để đăng ký / đặt lại bằng mã PIN.</div>
  </form>
</div>
<div id="toast"></div>

<script>
/* Điều hành sản xuất PHR – trang riêng (V22.433).
   Dùng chung máy chủ PHR (Apps Script), dữ liệu trên Google Drive của Admin và tài khoản, phân quyền PHR.
   Chương trình Điều hành SX (app.html) là cùng một mã nguồn với mục “Điều hành sản xuất” trong PHR, chạy trong khung bên dưới
   qua cầu nối window.phrSxBridge. Tài khoản phần mềm cân ZEN và khóa AI chỉ nằm trên máy chủ. */
const SXA_VERSION = 'V22.433';
const PHR_AUTH_API_URL = 'https://script.google.com/macros/s/AKfycbwwhWYlyQHzNussNTiMOXy0fbOFsXHeXKedQE4zAz_i-20gWh0q_0KFm5grr-xGoBj_Gg/exec';
const K = { tok: 'phr_auth_token', srv: 'phr_pwd_srv_', uname: 'phr_uname_map_v1', unameLast: 'phr_login_uname', roles: 'phr_account_roles_audit_v1', me: 'phr_sxa_email' };
const $ = s => document.querySelector(s);
const LS = { get(k) { try { return localStorage.getItem(k); } catch (_) { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch (_) { } }, del(k) { try { localStorage.removeItem(k); } catch (_) { } } };
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
function toast(t, bad) { const d = document.createElement('div'); d.textContent = t; if (bad) d.className = 'bad'; $('#toast').appendChild(d); setTimeout(() => d.remove(), bad ? 6000 : 3200); }
function chip(cls, t) { const c = $('#chip'); c.className = cls || ''; c.textContent = t; }

/* ---------- gọi máy chủ PHR (cùng cơ chế với chương trình PHR) ---------- */
const authUrl = () => LS.get('phr_auth_url') || PHR_AUTH_API_URL;
async function fetchT(url, opt, ms) { const c = new AbortController(), t = setTimeout(() => c.abort(), ms || 30000); try { return await fetch(url, Object.assign({ signal: c.signal }, opt)); } finally { clearTimeout(t); } }
async function post(url, body, n) { let last; for (let i = 0; i < (n || 3); i++) { try { return await fetchT(url, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body, redirect: 'follow' }, 30000); } catch (e) { last = e; if (i < (n || 3) - 1) await new Promise(r => setTimeout(r, 900 * (i + 1))); } } throw last; }
async function getQ(url, body, action) { if (body.length > 1800) return null; try { const r = await fetchT(url + (url.includes('?') ? '&' : '?') + 'q=' + encodeURIComponent(body), { method: 'GET', redirect: 'follow' }, 30000); const j = await r.json(); if (j && 'app' in j && action !== 'ping') return null; return j; } catch (_) { return null; } }
function devInfo() {
  const ua = navigator.userAgent || '';
  const br = /Zalo/i.test(ua) ? 'Zalo' : /FBAN|FBAV/i.test(ua) ? 'Facebook' : /coc_coc|CocCoc/i.test(ua) ? 'Cốc Cốc' : /Edg\//.test(ua) ? 'Edge' : /Firefox\//.test(ua) ? 'Firefox' : /CriOS|Chrome\//.test(ua) ? 'Chrome' : /Safari\//.test(ua) ? 'Safari' : 'Trình duyệt khác';
  const os = /iPhone/.test(ua) ? 'iPhone' : /iPad/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) ? 'iPad' : /Android/.test(ua) ? 'Android' : /Windows/.test(ua) ? 'Windows' : /Mac OS X/.test(ua) ? 'macOS' : /Linux/.test(ua) ? 'Linux' : 'Không rõ';
  const app = (matchMedia('(display-mode: standalone)').matches || navigator.standalone) ? ' · ứng dụng cài đặt' : '';
  return br + ' · ' + os + app + ' · trang Điều hành SX';
}
async function api(action, data) {
  if (/^(login|me|logout)$/.test(action)) data = Object.assign({ dev: devInfo() }, data || {});
  let url = authUrl(); const body = JSON.stringify(Object.assign({ action }, data || {}));
  let r = null;
  try { r = await post(url, body); }
  catch (_) {
    if (url !== PHR_AUTH_API_URL) { try { r = await post(PHR_AUTH_API_URL, body); LS.set('phr_auth_url', PHR_AUTH_API_URL); } catch (_) { } }
    if (!r) { const j = await getQ(url, body, action); if (j) return j; }
    if (!r) { const e = new Error(navigator.onLine === false ? 'Thiết bị đang mất mạng – bật Wi-Fi hoặc dữ liệu di động rồi thử lại.' : 'Không kết nối được máy chủ PHR (script.google.com). Kiểm tra mạng; VPN hoặc phần mềm chặn quảng cáo có thể đang chặn.'); e.code = 'net'; throw e; }
  }
  try { return await r.json(); } catch (_) { const e = new Error('Máy chủ PHR trả về dữ liệu không hợp lệ.'); e.code = 'bad'; throw e; }
}

/* ---------- mật khẩu: PBKDF2 310.000 vòng, “muối” do máy chủ cấp – giống chương trình PHR ---------- */
const b64 = b => btoa(String.fromCharCode(...new Uint8Array(b))), unb64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function derive(pw, salt) { const m = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']); return b64(await crypto.subtle.deriveBits({ name: 'PBKDF2', salt, iterations: 310000, hash: 'SHA-256' }, m, 256)); }
function saltBytes(v) { const s = String(v == null ? '' : v).trim(); if (/^P[0-9a-f]{32}$/.test(s)) return Uint8Array.from(s.slice(1).match(/../g), h => parseInt(h, 16)); if (s && /^[A-Za-z0-9+/]+={0,2}$/.test(s) && s.length % 4 === 0) return unb64(s); throw new Error('Dữ liệu mật khẩu của tài khoản bị lỗi định dạng – mở PHR để đặt lại mật khẩu bằng mã PIN.'); }
async function sha(s) { return [...new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)))].map(b => b.toString(16).padStart(2, '0')).join(''); }
const emailOk = e => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(e), userOk = u => /^[a-z0-9][a-z0-9._-]{2,29}$/.test(u);
const unameMap = () => { try { return JSON.parse(LS.get(K.uname) || '{}') || {}; } catch (_) { return {}; } };

function lgMsg(t, ok) { const m = $('#lg-msg'); m.textContent = t || ''; m.classList.toggle('show', !!t); m.classList.toggle('ok', !!ok); }
function showLogin(t) {
  $('#login').hidden = false; lgMsg(t || '');
  const u = LS.get(K.unameLast) || LS.get(K.me) || ''; if (u && !$('#lg-id').value) $('#lg-id').value = u;
  setTimeout(() => ($('#lg-id').value ? $('#lg-pw') : $('#lg-id')).focus(), 50);
}
async function doLogin(ev) {
  ev.preventDefault();
  const btn = $('#lg-go'), ident = $('#lg-id').value.trim().toLowerCase(), pw = $('#lg-pw').value;
  if (!crypto.subtle) return lgMsg('Trình duyệt không hỗ trợ mã hóa an toàn – mở trang bằng https.');
  if (!emailOk(ident) && !userOk(ident)) return lgMsg('Nhập tên đăng nhập (chữ không dấu, số, dấu chấm, gạch dưới) hoặc email.');
  if (!pw) return lgMsg('Vui lòng nhập mật khẩu.');
  btn.disabled = true; btn.innerHTML = '<span class="spin"></span>Đang đăng nhập…'; lgMsg('');
  try {
    let email = emailOk(ident) ? ident : (unameMap()[ident] || ''), rec = null;
    try { rec = email ? JSON.parse(LS.get(K.srv + email) || 'null') : null; } catch (_) { }
    let res = null, salt = '', hash = '';
    if (rec && rec.salt) { try { salt = rec.salt; hash = await derive(pw, saltBytes(salt)); res = await api('login', { email, hash }); } catch (e) { if (e.code === 'net') throw e; res = null; } if (res && !res.ok && (res.code === 'revoked' || res.code === 'nouser')) return lgMsg(res.msg); }
    if (!res || !res.ok) {
      const s = await api('salt', { email: email || ident }); if (!s.ok) return lgMsg(s.msg || 'Không tìm thấy tài khoản.');
      if (s.email) email = s.email;
      if (rec && rec.salt === s.salt && res) { $('#lg-pw').select(); return lgMsg('Mật khẩu không đúng.'); }
      salt = s.salt; hash = await derive(pw, saltBytes(salt)); res = await api('login', { email, hash });
      if (!res.ok) { $('#lg-pw').select(); return lgMsg(res.msg || 'Không đăng nhập được.'); }
    }
    LS.set(K.tok, res.token); LS.set(K.me, email);
    try { LS.set(K.srv + email, JSON.stringify({ salt, h: await sha(hash), role: res.role, at: new Date().toISOString() })); } catch (_) { }
    try { const r = JSON.parse(LS.get(K.roles) || '{}'); r[email] = { level: res.role || 'viewer' }; LS.set(K.roles, JSON.stringify(r)); } catch (_) { }
    if (res.username) { const m = unameMap(); Object.keys(m).forEach(k => { if (m[k] === email) delete m[k]; }); m[res.username.toLowerCase()] = email; LS.set(K.uname, JSON.stringify(m)); LS.set(K.unameLast, res.username.toLowerCase()); }
    $('#lg-pw').value = ''; $('#login').hidden = true;
    await boot(true);
  } catch (e) { lgMsg(e.message || 'Không đăng nhập được.'); }
  finally { btn.disabled = false; btn.textContent = 'Đăng nhập'; }
}

/* ---------- cầu nối cho chương trình Điều hành SX trong khung ---------- */
const tok = () => LS.get(K.tok) || '';
window.phrSxBridge = {
  async call(fn, args) {
    const r = await api('sx', Object.assign({}, args || {}, { fn, token: tok() }));
    if (r && r.code === 'auth') { chip('warn', '⚠ Phiên đăng nhập hết hạn'); showLogin(r.msg || 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.'); }
    return r;
  },
  save(blob, name) { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = name || 'tep'; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 4000); },
  status(st, msg) {
    if (st === 'ok') chip('ok', '☁ Đồng bộ Google Drive của Admin');
    else if (st === 'auth') { chip('warn', '⚠ Phiên đăng nhập hết hạn'); showLogin('Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.'); }
    else chip('warn', '⚠ Mất kết nối máy chủ – ' + (msg || 'đang thử lại'));
  }
};

/* ---------- menu chức năng (giống mục Điều hành sản xuất trong PHR) ---------- */
const SUB = [['run', '🚚 Điều hành SX & tiền lương', '🚚 Điều hành', ''], ['dm', '👷 Định mức nhân công', '👷 Định mức', 'dinh-muc-nc'], ['sc', '🔧 Chi phí sửa chữa', '🔧 Sửa chữa', 'sua-chua'], ['nl', '⛽ Nhiên liệu vận chuyển', '⛽ Nhiên liệu', 'nhien-lieu'], ['khac', '📦 Nội dung khác', '📦 Khác', 'noi-dung-khac']];
const VIEWS = SUB.map(x => x[3]).filter(Boolean);
$('#sub').innerHTML = SUB.map(([k, t, s]) => `<button type="button" data-k="${k}" class="${k === 'run' ? 'on' : ''}"><span class="lf">${t}</span><span class="ls">${s}</span></button>`).join('');
function mark(k) { document.querySelectorAll('#sub [data-k]').forEach(b => b.classList.toggle('on', b.dataset.k === k)); }
function fw() { const f = $('#frame'); try { return f && f.contentWindow && f.contentWindow.location.href !== 'about:blank' ? f.contentWindow : null; } catch (_) { return null; } }
function goSub(k) {
  mark(k); const w = fw(); if (!w) return;
  const want = (SUB.find(x => x[0] === k) || [])[3] || '', cur = (w.location.hash || '').slice(1);
  if (want) { if (cur !== want) w.location.hash = want; } else if (VIEWS.includes(cur)) w.location.hash = 'nhap';
}
$('#sub').onclick = e => { const b = e.target.closest('[data-k]'); if (b) goSub(b.dataset.k); };
function syncFromFrame() { const w = fw(); if (!w) return; const h = (w.location.hash || '').slice(1), s = SUB.find(x => x[3] && x[3] === h); mark(s ? s[0] : 'run'); }

/* ---------- mở chương trình ---------- */
let opened = false, watch = null;
function waitBox(html) { $('#host').innerHTML = `<div class="wait"><div class="bx">${html}</div></div>`; }
async function boot(fresh) {
  if (!tok()) { chip('', 'Chưa đăng nhập'); waitBox('Đăng nhập bằng tài khoản PHR để dùng chương trình Điều hành sản xuất.'); return showLogin(); }
  chip('', '⏳ Đang kiểm tra tài khoản…');
  let me;
  try { me = await api('sx', { fn: 'me', token: tok() }); }
  catch (e) { chip('warn', '⚠ Không kết nối được máy chủ'); waitBox(`<b>${esc(e.message)}</b><br><button type="button" class="btn" style="max-width:220px;margin:12px auto 0" onclick="boot()">↻ Thử lại</button>`); return; }
  if (!me || !me.ok) {
    if (me && me.code === 'auth') { LS.del(K.tok); chip('', 'Chưa đăng nhập'); waitBox('Đăng nhập bằng tài khoản PHR để dùng chương trình Điều hành sản xuất.'); return showLogin(fresh ? '' : (me.msg || 'Phiên đăng nhập đã hết hạn. Vui lòng đăng nhập lại.')); }
    if (me && me.code === 'noaccess') { chip('warn', '⚠ Chưa được cấp quyền'); waitBox(`<b>${esc(me.msg)}</b><br>Nhờ Admin PHR (Phòng PT&QLKCN) vào Quản trị tài khoản › phân quyền mục <b>Sản xuất</b> cho tài khoản <b>${esc(LS.get(K.me) || '')}</b>.<br><button type="button" class="btn" style="max-width:260px;margin:12px auto 0" onclick="logout(true)">Đăng nhập tài khoản khác</button>`); return; }
    chip('warn', '⚠ ' + ((me && me.msg) || 'Máy chủ báo lỗi')); waitBox(`<b>${esc((me && me.msg) || 'Máy chủ PHR chưa hỗ trợ mục Điều hành sản xuất.')}</b><br><button type="button" class="btn" style="max-width:220px;margin:12px auto 0" onclick="boot()">↻ Thử lại</button>`); return;
  }
  const RN = { quanly: 'Phòng PT&QLKCN', dieuhanh: 'Điều hành', nhaplieu: 'Nhập liệu', cn: 'Chỉ xem' };
  $('#who').innerHTML = `${esc(me.name || me.email)}<small>${esc(RN[me.role] || me.role || '')}${me.perm === 'view' ? ' · chỉ xem' : ''}</small>`;
  if (me.email) LS.set(K.me, me.email);
  chip('ok', '☁ Đồng bộ Google Drive của Admin');
  if (!opened || fresh) openFrame();
  clearInterval(watch); watch = setInterval(ping, 5 * 60 * 1000);
}
function openFrame() {
  opened = true; const f = document.createElement('iframe');
  f.id = 'frame'; f.title = 'Điều hành sản xuất Đội xe - Cơ khí - PE'; f.setAttribute('allow', 'camera; clipboard-write; fullscreen');
  const want = (location.hash || '').slice(1), s = SUB.find(x => x[0] === want);
  f.src = 'app.html?v=' + encodeURIComponent(SXA_VERSION) + (s && s[3] ? '#' + s[3] : '');
  f.addEventListener('load', () => { const w = fw(); if (!w) return; syncFromFrame(); w.addEventListener('hashchange', syncFromFrame); });
  $('#host').innerHTML = ''; $('#host').appendChild(f); mark(s ? s[0] : 'run');
}
/* giữ phiên: máy chủ tự gia hạn khi đang dùng; bị thu hồi / hết hạn → đăng nhập lại */
async function ping() {
  if (!tok() || document.hidden) return;
  let r; try { r = await api('me', { token: tok() }); } catch (_) { return; }
  if (r && !r.ok && (r.code === 'expired' || r.code === 'revoked')) { if (r.code === 'revoked') LS.del(K.tok); chip('warn', '⚠ ' + r.msg); showLogin(r.msg); }
}
async function logout(silent) {
  if (!silent && !confirm('Đăng xuất khỏi Điều hành sản xuất?\nChương trình PHR mở trên trình duyệt này cũng sẽ phải đăng nhập lại (dùng chung phiên).')) return;
  const t = tok(); LS.del(K.tok);
  try { Object.keys(localStorage).filter(k => k.indexOf('phr_sx_cache_') === 0).forEach(k => localStorage.removeItem(k)); } catch (_) { }
  if (t) api('logout', { token: t }).catch(() => { });
  clearInterval(watch); opened = false; $('#who').textContent = ''; chip('', 'Chưa đăng nhập');
  waitBox('Đã đăng xuất. Nếu dùng máy chung, hãy đóng cửa sổ trình duyệt.'); $('#lg-pw').value = ''; showLogin('');
}
/* phiên bị thay đổi ở thẻ PHR khác trên cùng trình duyệt */
window.addEventListener('storage', e => {
  if (e.key !== K.tok) return;
  if (!e.newValue && opened) { opened = false; chip('warn', '⚠ Đã đăng xuất ở PHR'); waitBox('Tài khoản đã đăng xuất ở chương trình PHR trên trình duyệt này.'); showLogin('Đã đăng xuất ở chương trình PHR. Vui lòng đăng nhập lại.'); }
  else if (e.newValue && !$('#login').hidden) { $('#login').hidden = true; boot(true); }
});

/* ---------- phiên bản mới ---------- */
async function checkVer() {
  try {
    const v = await (await fetch('../version.json?t=' + Date.now(), { cache: 'no-store' })).json();
    if (v && v.version && v.version !== SXA_VERSION) { const u = $('#upd'); u.hidden = false; u.innerHTML = `🔔 Đã có phiên bản mới <b>${esc(v.version)}</b>. <button type="button" id="upd-go">Cập nhật ngay</button>`; $('#upd-go').onclick = () => { if (navigator.serviceWorker && navigator.serviceWorker.controller) navigator.serviceWorker.getRegistration().then(r => r && r.update()).finally(() => location.reload()); else location.reload(); }; }
  } catch (_) { }
}
document.addEventListener('visibilitychange', () => { if (!document.hidden) { checkVer(); ping(); } });
setInterval(checkVer, 30 * 60 * 1000);

$('#lg-form').addEventListener('submit', doLogin);
$('#b-out').onclick = () => logout(false);
$('#b-reload').onclick = () => { if (opened) openFrame(); else boot(); };
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => { });
boot(); setTimeout(checkVer, 4000);
</script>
