<!doctype html>
<title>Hệ thống quản lý điều hành sản xuất Đội xe - Cơ khí - PE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&family=Tinos:ital,wght@0,400;0,700;1,400&display=swap">
<style>
/* Bố cục: ứng dụng tác nghiệp — thanh điều hướng trái (máy tính) / thanh tab dưới (điện thoại); thẻ "phiếu cân" có mép răng cưa cho chuyến xe */
:root{
  --bg:#f2f4f1; --surface:#ffffff; --surface-2:#eaeee9; --fg:#16201b; --muted:#5a685f; --line:#d6ddd6;
  --primary:#1e5b43; --primary-fg:#ffffff; --primary-soft:#dfece4;
  --accent:#b06d07; --accent-soft:#f8ecd6;
  --ok:#2a7748; --ok-soft:#dff0e5; --warn:#9a5b00; --warn-soft:#fbeed8; --bad:#ad2e27; --bad-soft:#f7dfdc;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 4px 14px rgba(22,32,27,.05);
  --f-ui:"Be Vietnam Pro",system-ui,"Segoe UI",Roboto,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --f-paper:"Tinos","Times New Roman",Times,serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0f1512; --surface:#17201b; --surface-2:#1e2924; --fg:#e4ebe6; --muted:#98a99f; --line:#2b3731;
  --primary:#62bf93; --primary-fg:#0b1912; --primary-soft:#1b392a; --accent:#e5a33d; --accent-soft:#3a2c13;
  --ok:#6cc791; --ok-soft:#163525; --warn:#e5a33d; --warn-soft:#3a2c13; --bad:#ef837b; --bad-soft:#3c1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0f1512; --surface:#17201b; --surface-2:#1e2924; --fg:#e4ebe6; --muted:#98a99f; --line:#2b3731;
  --primary:#62bf93; --primary-fg:#0b1912; --primary-soft:#1b392a; --accent:#e5a33d; --accent-soft:#3a2c13;
  --ok:#6cc791; --ok-soft:#163525; --warn:#e5a33d; --warn-soft:#3a2c13; --bad:#ef837b; --bad-soft:#3c1c1a;
  --shadow:0 1px 2px rgba(0,0,0,.3); color-scheme:dark }
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-ui);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
.num,.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{background:var(--surface);border-right:1px solid var(--line);padding:18px 12px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;gap:10px;align-items:center;padding:4px 8px 16px}
.brand{align-items:center}
.logo{flex:none;border-radius:10px;object-fit:contain;background:#fff}
.logo.wide{border-radius:0;background:transparent}.logo.ph{display:grid;place-items:center;background:var(--primary);color:var(--primary-fg);font-weight:700;font-size:12px;letter-spacing:.06em}
.brand b{font-size:13.5px!important;line-height:1.3}
.mobbrand{display:none}
.brand b{display:block;font-size:15px;letter-spacing:-.01em}
.brand span{display:block;font-size:11.5px;color:var(--muted)}
.nav a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2)}
.nav a[aria-current="page"]{background:var(--primary-soft);color:var(--primary)}
.nav a .badge{margin-left:auto}
.nav svg{width:18px;height:18px;flex:none}
.who{margin-top:auto;border-top:1px solid var(--line);padding:12px 8px 0;display:flex;gap:10px;align-items:center;font-size:12.5px}
.who img{width:30px;height:30px;border-radius:50%}.who .av{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:var(--primary);color:var(--primary-fg);font-weight:700;flex:none}
.who small{display:block;color:var(--muted)}
.main{min-width:0;padding-block:18px 40px;padding-left:max(24px,env(safe-area-inset-left,0px));padding-right:max(24px,env(safe-area-inset-right,0px))}
.topbar{display:flex;flex-wrap:wrap;align-items:center;gap:12px;margin-bottom:16px}
.topbar h1{font-size:20px;margin:0;letter-spacing:-.015em;text-wrap:balance}
.topbar .sp{flex:1}
.ky{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px 4px 3px 12px}
.ky label{font-size:12px;color:var(--muted)}
.ky input{border:0;background:transparent;padding:4px 6px;font-family:var(--f-mono);font-weight:600}
.lockpill{font-size:12px;font-weight:600;border-radius:999px;padding:4px 10px}
.lockpill.open{background:var(--ok-soft);color:var(--ok)}
.lockpill.locked{background:var(--bad-soft);color:var(--bad)}
.banner{border-radius:var(--r);padding:10px 14px;margin-bottom:14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--primary-soft);color:var(--primary)}
.banner.bad{background:var(--bad-soft);color:var(--bad)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card h2{font-size:15px;margin:0 0 12px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card h2 small{font-weight:400;color:var(--muted);font-size:12.5px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.nh-top{grid-template-columns:minmax(0,170px) minmax(0,1fr) auto;align-items:end}
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px;align-items:start}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:12px;font-weight:500;color:var(--muted)}
.field input,.field select,.field textarea{background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 10px;min-width:0;width:100%}
.field input[type="date"]{-webkit-appearance:none;appearance:none;min-height:40px;display:block;text-align:left}
.field input[type="date"]::-webkit-date-and-time-value{text-align:left}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--primary);outline-offset:-1px;border-color:transparent}
.hint{font-size:12px;color:var(--muted)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 13px;font-weight:600;cursor:pointer;white-space:nowrap}
.btn:hover{background:var(--surface-2)}
.btn:focus-visible,.seg button:focus-visible,.nav a:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
.btn.pri{background:var(--primary);color:var(--primary-fg);border-color:var(--primary)}
.btn.pri:hover{filter:brightness(1.07)}
.btn.acc{background:var(--accent);color:#fff;border-color:var(--accent)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.danger{color:var(--bad)}
.btn.sm{padding:5px 9px;font-size:12.5px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 11px;cursor:pointer;font-weight:600;min-width:44px}
.seg button[aria-pressed="true"]{background:var(--primary);border-color:var(--primary);color:var(--primary-fg)}
.chip{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:2px 9px;font-size:11.5px;font-weight:600;white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)} .chip.cho{background:var(--warn-soft);color:var(--warn)} .chip.huy{background:var(--bad-soft);color:var(--bad)}
.chip.mute{background:var(--surface-2);color:var(--muted)}
.badge{background:var(--accent);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:1px 7px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.kpi span{display:block;font-size:12px;color:var(--muted)}
.kpi b{display:block;font-family:var(--f-mono);font-size:19px;font-weight:600;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi i{font-style:normal;font-size:11.5px;color:var(--muted)}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
table.t th{position:sticky;top:0;background:var(--surface-2);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.t td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
table.t tr:last-child td{border-bottom:0}
table.t td.r,table.t th.r{text-align:right}
table.t tfoot td{font-weight:700;background:var(--surface-2)}
table.t input,table.t select{background:transparent;border:1px solid transparent;border-radius:6px;padding:5px 6px;width:100%;min-width:60px}
table.t input:focus,table.t select:focus{border-color:var(--primary);outline:none;background:var(--bg)}
.ticket{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px 10px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.ticket::before{content:"";position:absolute;left:6px;top:8px;bottom:8px;border-left:2px dashed var(--line)}
.ticket .pn{font-family:var(--f-mono);font-weight:600;font-size:13px}
.ticket .meta{font-size:12px;color:var(--muted)}
.ticket .amt{text-align:right;font-family:var(--f-mono);font-weight:600}
.ticket .act{grid-column:1/-1;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.ticket img.th{width:44px;height:44px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in}
.list{display:flex;flex-direction:column;gap:8px}
.cal{display:grid;grid-template-columns:repeat(auto-fill,minmax(34px,1fr));gap:4px}
.cal button{aspect-ratio:1;border:1px solid var(--line);background:var(--bg);border-radius:6px;font-size:11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1;padding:0}
.cal button b{font-family:var(--f-mono);font-size:12px}
.cal button.sun{background:var(--accent-soft)}
.cal button.cur{outline:2px solid var(--primary);outline-offset:-2px}
.cal button.m-x b{color:var(--ok)} .cal button.m-n b{color:var(--warn)} .cal button.m-L b,.cal button.m-P b,.cal button.m-R b{color:var(--primary)}
.cal button.m-K b,.cal button.m-Ô b{color:var(--bad)}
.cal button.lv{background:repeating-linear-gradient(135deg,var(--primary-soft) 0 4px,var(--bg) 4px 8px)}
.cal button.au{box-shadow:inset 0 0 0 1px var(--primary);border-style:dashed}
.cal button.nw b{text-decoration:line-through;opacity:.55}
#sg-card td select,#sg-card td input{min-width:175px}#sg-card td:first-child{min-width:150px}
.who-card{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.avatar{width:44px;height:44px;border-radius:12px;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:16px;flex:none}
.who-card .stats{display:flex;gap:18px;flex-wrap:wrap;margin-left:auto}
.who-card .stats div span{display:block;font-size:11.5px;color:var(--muted)}
.who-card .stats div b{font-family:var(--f-mono);font-size:15px}
.calc-line{font-family:var(--f-mono);font-size:12.5px;background:var(--surface-2);border-radius:8px;padding:8px 10px}
.bars{display:flex;align-items:flex-end;gap:3px;height:120px;padding-top:6px}
.bars div{flex:1;background:var(--primary);border-radius:3px 3px 0 0;min-height:1px;opacity:.85;position:relative}
.bars div.z{background:var(--line)}
.bars-x{display:flex;gap:3px;font-size:10px;color:var(--muted);font-family:var(--f-mono)}
.bars-x span{flex:1;text-align:center}
.tabs2{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:12px;border-bottom:1px solid var(--line)}
.tabs2 button{border:0;background:transparent;padding:8px 12px;font-weight:600;color:var(--muted);border-bottom:2px solid transparent;cursor:pointer}
.tabs2 button[aria-selected="true"]{color:var(--primary);border-bottom-color:var(--primary)}
.forms{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.fitem{border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px;background:var(--surface)}
.fitem b{font-size:13.5px}
.fitem .row .btn{flex:1}
.check{display:flex;gap:10px;align-items:flex-start;padding:7px 0;border-bottom:1px solid var(--line);font-size:13px}
.check:last-child{border-bottom:0}
.check .chip{margin-left:auto}
.empty{padding:28px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--fg);font-size:15px;margin-bottom:4px}
.photo-prev{display:flex;gap:10px;align-items:center}
.photo-prev img{width:72px;height:72px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.filebtn{position:relative;overflow:hidden}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));z-index:60;display:flex;flex-direction:column;gap:6px;align-items:center;pointer-events:none}
#toast div{background:var(--fg);color:var(--bg);padding:9px 14px;border-radius:8px;font-weight:500;box-shadow:var(--shadow);max-width:min(92vw,520px)}
#toast div.bad{background:var(--bad);color:#fff}
.modal{position:fixed;inset:0;background:rgba(10,16,13,.55);z-index:50;display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.modal .box{background:var(--surface);border-radius:12px;max-width:min(1180px,100%);max-height:100%;overflow:auto;width:100%;box-shadow:var(--shadow)}
.modal .box.narrow{max-width:520px}
.modal .mh{display:flex;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal .mh b{flex:1}
.modal .mb{padding:16px}
.modal .paperwrap{background:#8a958f;padding:16px;overflow:auto}
/* ===== Giấy in (luôn nền trắng chữ đen) ===== */
.paper{background:#fff;color:#000;font-family:var(--f-paper);font-size:13px;padding:76px;margin:0 auto;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.paper.portrait{width:794px}.paper.landscape{width:1123px}
.paper.small{font-size:11px}
.paper .ph{display:flex;justify-content:space-between;gap:20px;margin-bottom:14px}
.paper .ph>div{display:flex;flex-direction:column;align-items:center;text-align:center}
.paper .ph .cq{text-transform:uppercase}
.paper .ph .ln,.paper .ph .ln3{position:relative;padding-bottom:5px}
.paper .ph .ln::after,.paper .ph .ln3::after{content:"";position:absolute;bottom:0;left:0;right:0;border-top:1px solid #000}
.paper .ph .ln3::after{left:33%;right:33%}
.paper .ph i{margin-top:6px}
.paper .tln{width:22%;margin:2px auto 12px;border-top:1px solid #000}
.paper .pt{text-align:center;font-weight:700;font-size:17px;margin-top:4px}
.paper .pt.s{font-size:14px;margin-top:2px;margin-bottom:4px}
.paper p{margin:3px 0}.paper p.b{font-weight:700}.paper p.i{font-style:italic}
.paper table.pg{border-collapse:collapse;width:100%;table-layout:auto;margin:8px 0}table.pg.fx{table-layout:fixed}
.paper table.pg td{border:1px solid #777;padding:2px 3px;vertical-align:middle;overflow-wrap:normal;word-break:normal;hyphens:manual;white-space:pre-line}
.paper table.pg tr.r-h td{line-height:1.25;font-size:.95em}
.paper.small table.pg tr.r-h td{font-size:.9em;padding:2px 1px}
.paper table.pg tr.r-h td{background:#d9d9d9;font-weight:700;text-align:center}
.paper table.pg tr.r-t td{background:#e2efda}.paper table.pg tr.r-s td{background:#f2f2f2}
.paper td.ar{text-align:right;font-variant-numeric:tabular-nums}.paper td.ac{text-align:center}.paper td.b{font-weight:700}.paper td.i{font-style:italic}
.paper .sgs{break-inside:avoid;page-break-inside:avoid}
.paper .sg{display:flex;justify-content:space-around;gap:10px;margin-top:16px;text-align:center}
.paper .sg>div{display:flex;flex-direction:column;align-items:center;flex:1}
.paper .sg i{font-size:.9em}.paper .sg .sn{margin-top:72px;font-weight:700}
details.help{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:var(--surface)}
details.help summary{cursor:pointer;padding:10px 12px;font-weight:600;display:flex;gap:10px;align-items:center;list-style:none}
details.help summary::-webkit-details-marker{display:none}
details.help[open] summary{border-bottom:1px solid var(--line)}
details.help .hn{width:22px;height:22px;border-radius:50%;background:var(--primary-soft);color:var(--primary);display:grid;place-items:center;font-size:12px;flex:none}
details.help ul{margin:0;padding:10px 14px 12px 34px;display:flex;flex-direction:column;gap:6px;line-height:1.5}
.modal .box.narrow{max-width:640px}
#offscreen{position:fixed;left:-20000px;top:0}
.mobnav{display:none}
@media (max-width:980px){.split,.g3,.g4{grid-template-columns:minmax(0,1fr)}.g2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .mobbrand{display:flex;gap:10px;align-items:center;margin-bottom:12px}
  .mobbrand b{display:block;font-size:13px;line-height:1.25}
  .mobbrand span{display:block;font-size:11.5px;color:var(--muted)}
  .main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .mobnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--surface);border-top:1px solid var(--line);padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .mobnav a{display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10.5px;color:var(--muted);text-decoration:none;padding:4px 6px;border-radius:8px;position:relative;flex:1}
  .mobnav a svg{width:21px;height:21px}
  .mobnav a[aria-current="page"]{color:var(--primary)}
  .mobnav a .badge{position:absolute;top:0;right:calc(50% - 22px);font-size:9.5px;padding:0 5px}
  .who-card .stats{margin-left:0}
  .topbar h1{font-size:18px;width:100%}
  .nh-top{grid-template-columns:minmax(0,1fr) auto}
  .nh-top>label:nth-child(2){grid-column:1/-1;order:3}
  #toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
}
@media (prefers-reduced-motion:no-preference){.btn,.seg button,.nav a{transition:background .12s,filter .12s}}
/* PHR: khi chạy trong tab Điều hành sản xuất – menu dưới cùng màu thanh tiêu đề tab (xanh ngọc), mục đang mở nền trắng + vạch vàng */
html.phr-host .mobnav{background:linear-gradient(90deg,#0f766e,#14958a);border-top:1px solid #0b5f58}
html.phr-host .mobnav a{color:#fff;font-weight:700}
html.phr-host .mobnav a[aria-current="page"]{background:#fff;color:#0f766e;box-shadow:inset 0 -3px 0 #fbbf24}
html.phr-host .nav a[aria-current="page"]{background:#ccfbf1;color:#0f766e;font-weight:700;box-shadow:inset 3px 0 0 #fbbf24}
.banner.blk{display:block;line-height:1.5}
.ocr-img{margin:6px 0 4px;font-size:13px}.ocr-img summary{cursor:pointer;font-weight:600;color:var(--primary)}.ocr-img img{display:block;max-width:100%;max-height:70vh;margin-top:6px;border:1px solid var(--line,#ddd);border-radius:8px;object-fit:contain}
</style>
<div id="root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<div id="offscreen" aria-hidden="true"></div>
<script>
/* ===== Lớp kết nối Hệ thống PHR =====
   Khi chương trình chạy trong tab "Sản xuất" của Hệ thống PHR (khung riêng), lớp này cung cấp
   window.claude.use("db" | "user" | "assets" | "downloads") giống claude.ai, nhưng dữ liệu đi qua
   máy chủ PHR (Apps Script) và lưu trên Google Drive của Admin: DATA SOURCE / PHR_SXDoiXe_DuLieu.
   - Ghi: áp dụng ngay trên màn hình, gửi gộp lên máy chủ; lỗi thì tải lại dữ liệu và báo lỗi.
   - Đọc: tải theo "gói" (cấu hình, từng kỳ), 15 giây hỏi máy chủ 1 lần xem gói nào đã đổi. */
(function () {
  if (window.claude && window.claude.use) return;
  let P = null;
  try { P = window.parent !== window ? window.parent.phrSxBridge : null; } catch (_) { P = null; }
  if (!P) return;
  window.PHR_HOST = true;
  try { document.documentElement.setAttribute("data-theme", "light"); document.documentElement.classList.add("phr-host"); } catch (_) { }   // PHR luôn nền sáng
  // Khung nhúng (srcdoc): liên kết "#muc" phải chuyển màn ngay trong chương trình, không được tải trang PHR vào khung
  document.addEventListener("click", e => {
    const a = e.target && e.target.closest ? e.target.closest('a[href^="#"]') : null; if (!a) return;
    e.preventDefault();
    const h = a.getAttribute("href") || "#";
    if (h === "#") return;
    if (location.hash !== h) location.hash = h; else window.dispatchEvent(new HashChangeEvent("hashchange"));
  }, true);

  const PART = { trips: 1, ps: 1, pe: 1 };
  const COLS = ["config", "periods", "chamcong", "trips", "ps", "pe", "nghi", "bank"];
  const POLL_MS = 15000;
  const clone = o => o == null ? o : JSON.parse(JSON.stringify(o));
  const isObj = v => v && typeof v === "object" && !Array.isArray(v);
  const isDel = v => isObj(v) && v.__delete__ === true;
  function merge(a, b) {
    const o = isObj(a) ? a : {};
    Object.keys(b || {}).forEach(k => {
      const v = b[k];
      if (isDel(v)) delete o[k];
      else if (isObj(v)) o[k] = merge(isObj(o[k]) ? o[k] : {}, v);
      else o[k] = clone(v);
    });
    return o;
  }
  function err(code, msg) { const e = new Error(msg || code); e.code = code; return e; }
  function keyOf(col, id, ky) {
    if (COLS.indexOf(col) < 0) throw err("invalid-argument", "Bảng dữ liệu không hợp lệ: " + col);
    if (col === "nghi") return "nghi__all";
    if (PART[col]) { const k = ky || (String(id || "").match(/^(\d{4}-\d\d)_/) || [])[1]; return k ? col + "__" + k : null; }
    return col + "__" + id;
  }
  async function call(fn, args) {
    const r = await P.call(fn, args || {});
    if (!r || !r.ok) throw err((r && r.code) || "unavailable", (r && r.msg) || "Máy chủ PHR báo lỗi.");
    return r;
  }

  /* ---------- kho trên máy ---------- */
  const parts = {};      // key → { rev, docs:{id:data}, ok, err, p:Promise }
  const subs = new Set();
  const pending = {};    // key → số lệnh ghi đang chờ
  function part(key) { return parts[key] || (parts[key] = { rev: -1, docs: {}, ok: false }); }
  /* V22.267 – TĂNG TỐC: các gói cần nạp trong cùng một nhịp được gộp vào MỘT lệnh load (trước đây mỗi gói 1 lệnh → 10–15 lượt hỏi máy chủ khi mở) */
  let batchKeys = [], batchP = null;
  function loadBatched(key) {
    batchKeys.push(key);
    if (!batchP) batchP = new Promise(r => setTimeout(r, 0)).then(() => {
      const ks = [...new Set(batchKeys)]; batchKeys = []; batchP = null;
      /* V22.413 – danh mục (config, kỳ lương, ngân hàng) nạp riêng 1 lượt nhẹ; các gói dữ liệu tháng lớn (chuyến xe, phát sinh, PE, chấm công, đơn nghỉ) mỗi gói 1 lượt song song → danh mục hiện ngay, không phải chờ gói chuyến xe lớn */
      const heavy = k => /^(trips|ps|pe|chamcong|nghi)__/.test(k), light = ks.filter(k => !heavy(k));
      const chunks = []; for (let i = 0; i < light.length; i += 30) chunks.push(light.slice(i, i + 30));
      ks.filter(heavy).forEach(k => chunks.push([k]));
      return Promise.all(chunks.map(c => load(c)));
    });
    return batchP;
  }
  function ensure(key) {
    const p = part(key);
    if (p.ok) return Promise.resolve(p);
    if (!p.p) p.p = loadBatched(key).then(() => { p.p = null; if (p.err) throw p.err; return p; }, e => { p.p = null; if (p.err) throw p.err; throw e; });
    return p.p;
  }
  async function load(keys) {
    let r;
    try { r = await call("load", { keys }); }
    catch (e) { keys.forEach(k => { const p = part(k); p.err = e; }); keys.forEach(emit); throw e; }
    keys.forEach(k => {
      const x = (r.parts || {})[k], p = part(k);
      if (!x) return;
      if (x.err) { p.err = err(x.code || "permission-denied", x.err); p.ok = false; return; }
      p.err = null; p.ok = true; p.rev = x.rev || 0; p.docs = x.docs || {};
    });
    keys.forEach(emit);
  }
  /* V22.410 – TĂNG TỐC NHẬP HÀNG LOẠT: khi đang nhập nhiều chuyến, tạm gom các lần vẽ lại màn hình, vẽ 1 lần khi xong */
  let muted = 0; const mutedKeys = new Set();
  function emit(key) { if (muted) { mutedKeys.add(key); return; } subs.forEach(s => { if (s.key === key) fire(s); }); }
  function bulk(on) { if (on) { muted++; return; } muted = Math.max(0, muted - 1); if (!muted) { const ks = [...mutedKeys]; mutedKeys.clear(); ks.forEach(emit); } }
  function fire(s) {
    const p = part(s.key);
    if (p.err) { if (s.onErr) s.onErr(p.err); return; }
    if (!p.ok) return;
    try { s.fn(s.snap(p)); } catch (e) { console.error(e); }
  }
  function docSnap(id, data) { return { id, exists: data != null, data: () => clone(data) }; }

  /* ---------- ghi gộp ---------- */
  let queue = [], timer = null;
  function enqueue(op) {
    return new Promise((res, rej) => {
      queue.push({ op, res, rej });
      pending[op.key] = (pending[op.key] || 0) + 1;
      clearTimeout(timer); timer = setTimeout(flush, 40);
    });
  }
  let flushing = Promise.resolve();
  const WMAX = 150;   // V22.410: máy chủ nhận tối đa 200 lệnh/lượt → chia gói 150 lệnh, gửi nối tiếp
  function flush() {
    const all = queue; queue = [];
    if (!all.length) return;
    for (let i = 0; i < all.length; i += WMAX) flushOne(all.slice(i, i + WMAX));
  }
  function flushOne(batch) {
    flushing = flushing.then(async () => {
      const keys = [...new Set(batch.map(b => b.op.key))];
      const before = {}; keys.forEach(k => before[k] = part(k).rev);
      try {
        const r = await call("write", { ops: batch.map(b => { const o = Object.assign({}, b.op); delete o.key; return o; }) });
        const reload = [];
        keys.forEach(k => {
          const p = part(k), x = (r.revs || {})[k];
          if (x) { if (x.prev !== before[k] && before[k] >= 0) reload.push(k); p.rev = x.rev; }
        });
        batch.forEach(b => { pending[b.op.key]--; b.res(); });
        if (reload.length) load(reload).catch(() => { });
      } catch (e) {
        batch.forEach(b => { pending[b.op.key]--; b.rej(e); });
        keys.forEach(k => { part(k).ok = false; });
        load(keys).catch(() => { });
      }
    });
  }
  async function write(kind, col, id, data, ky) {
    const key = keyOf(col, id, ky || (data && data.ky));
    if (!key) throw err("invalid-argument", "Thiếu kỳ (ky) của bản ghi " + col + "/" + id);
    const p = await ensure(key);
    const cur = p.docs[id];
    if (kind === "update" && cur == null) throw err("not-found", "Không có bản ghi " + col + "/" + id);
    if (kind === "set") { const d = merge({}, data); p.docs[id] = d; }
    else if (kind === "update") p.docs[id] = merge(clone(cur), data);
    else delete p.docs[id];
    emit(key);
    const k = (String(key).split("__")[1]);
    return enqueue({ key, op: kind, col, id, ky: PART[col] ? k : undefined, data: kind === "delete" ? undefined : data });
  }

  /* ---------- hỏi thay đổi định kỳ ---------- */
  let polling = false;
  async function poll() {
    if (polling || document.visibilityState === "hidden") return;
    const keys = [...new Set([...subs].map(s => s.key))].filter(k => parts[k] && parts[k].ok && !pending[k]);
    if (!keys.length) return;
    polling = true;
    try {
      const r = await call("revs", { keys });
      const ch = keys.filter(k => (r.revs || {})[k] != null && r.revs[k] !== part(k).rev && !pending[k]);
      if (ch.length) await load(ch);
      if (P.status) P.status("ok");
    } catch (e) { if (P.status) P.status(e.code === "auth" ? "auth" : "offline", e.message); }
    finally { polling = false; }
  }
  setInterval(poll, POLL_MS);
  document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") poll(); });

  /* ---------- db ---------- */
  function docRef(path) {
    const seg = String(path).split("/"); if (seg.length !== 2) throw err("invalid-argument", "Đường dẫn không hợp lệ: " + path);
    const col = seg[0], id = seg[1];
    const keyHint = () => { const k = keyOf(col, id); if (k) return k; const f = Object.keys(parts).find(x => x.indexOf(col + "__") === 0 && parts[x].docs[id] != null); return f || null; };
    return {
      id, path,
      async get() { const k = keyHint(); if (!k) return docSnap(id, null); const p = await ensure(k); return docSnap(id, p.docs[id]); },
      set(data) { return write("set", col, id, data); },
      update(data) { const k = keyHint(); return write("update", col, id, data, k ? k.split("__")[1] : undefined); },
      delete() { const k = keyHint(); if (!k) return Promise.resolve(); return write("delete", col, id, null, k.split("__")[1]); },
      onSnapshot(fn, onErr) {
        const k = keyOf(col, id); if (!k) { fn(docSnap(id, null)); return () => { }; }
        const s = { key: k, fn, onErr, snap: p => docSnap(id, p.docs[id]) };
        subs.add(s); ensure(k).then(() => fire(s), () => { });
        if (part(k).ok) fire(s);
        return () => subs.delete(s);
      }
    };
  }
  function query(col, filters) {
    const match = d => filters.every(([f, op, v]) => op === "==" ? d[f] === v : op === "array-contains" ? Array.isArray(d[f]) && d[f].indexOf(v) >= 0 : op === "in" ? v.indexOf(d[f]) >= 0 : true);
    const keyQ = () => { if (col === "nghi") return "nghi__all"; const ky = (filters.find(f => f[0] === "ky" && f[1] === "==") || [])[2]; return keyOf(col, null, ky); };
    const snapOf = p => { const docs = Object.keys(p.docs).filter(id => match(p.docs[id])).map(id => docSnap(id, p.docs[id])); return { docs, size: docs.length, empty: !docs.length }; };
    return {
      where(f, op, v) { return query(col, filters.concat([[f, op, v]])); },
      async get() { const k = keyQ(); if (!k) throw err("invalid-argument", "Truy vấn " + col + " cần điều kiện ky"); return snapOf(await ensure(k)); },
      onSnapshot(fn, onErr) {
        const k = keyQ(); if (!k) { if (onErr) onErr(err("invalid-argument", "Truy vấn " + col + " cần điều kiện ky")); return () => { }; }
        const s = { key: k, fn, onErr, snap: snapOf };
        subs.add(s); ensure(k).then(() => fire(s), () => { });
        if (part(k).ok) fire(s);
        return () => subs.delete(s);
      },
      async add(data) {
        const ky = data && data.ky, id = (PART[col] && ky ? ky + "_" : "") + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
        await write("set", col, id, data, ky); return docRef(col + "/" + id);
      },
      doc(id) { return docRef(col + "/" + id); }
    };
  }
  const db = { doc: docRef, collection: c => query(c, []), bulk };

  /* ---------- người dùng ---------- */
  let meP = null;
  const user = {
    me() {
      if (!meP) meP = call("me", {}).then(r => ({ id: r.email, name: r.name || r.email, avatarUrl: "", isOwner: r.role === "quanly", canEdit: r.role === "quanly", appRole: r.role, perm: r.perm }));
      return meP;
    },
    async can(what) { const m = await user.me(); return what === "data.write" ? m.appRole !== "cn" : m.isOwner; },
    async profiles(ids) { try { const r = await call("names", { ids }); return r.names || {}; } catch (_) { return {}; } },
    async search(q) { try { const r = await call("users", { q: q || "" }); return (r.users || []).map(u => ({ id: u.email, name: u.name + (u.name !== u.email ? " · " + u.email : ""), avatarUrl: "" })); } catch (_) { return []; } }
  };

  /* ---------- ảnh (phiếu cân, logo) ---------- */
  const blobs = {};
  function b64Of(blob) { return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1] || ""); r.onerror = rej; r.readAsDataURL(blob); }); }
  const assets = {
    async upload(blob, opt) {
      if (blob.size > 8 * 1024 * 1024) throw err("invalid-argument", "Ảnh quá lớn (tối đa 8 MB).");
      const r = await call("upload", { name: (blob.name || "anh") , mime: (opt && opt.type) || blob.type || "application/octet-stream", b64: await b64Of(blob) });
      return { id: r.id };
    }
  };
  function blobUrl(id) {
    if (!blobs[id]) blobs[id] = call("blob", { id }).then(r => URL.createObjectURL(new Blob([Uint8Array.from(atob(r.b64), c => c.charCodeAt(0))], { type: r.mime || "image/jpeg" })));
    return blobs[id];
  }
  function fixImgs(root) {
    (root.querySelectorAll ? root.querySelectorAll('img[src^="/_blob/"]') : []).forEach(img => {
      const id = img.getAttribute("src").slice(7);
      img.setAttribute("src", "data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==");
      img.dataset.blob = id;
      blobUrl(id).then(u => { if (img.dataset.blob === id) img.src = u; }, () => { img.alt = "Không tải được ảnh"; });
    });
  }
  new MutationObserver(ms => ms.forEach(m => m.addedNodes.forEach(n => { if (n.nodeType === 1) { if (n.matches && n.matches('img[src^="/_blob/"]')) fixImgs(n.parentNode || n); else fixImgs(n); } }))).observe(document.documentElement, { childList: true, subtree: true });

  /* ---------- tải file ---------- */
  const downloads = { async save(o) { P.save(o.data instanceof Blob ? o.data : new Blob([o.data]), o.filename || "tep"); return { ok: true }; } };

  const svc = { db, user, assets, downloads };
  window.claude = {
    async use(name) {
      if (!svc[name]) throw err("unavailable", name);
      if (name === "db") { try { await user.me(); } catch (e) { window.PHR_HOST_ERR = e.code === "auth" ? "Phiên đăng nhập PHR đã hết hạn. Đăng nhập lại Hệ thống PHR rồi mở lại tab Sản xuất." : (e.message || "Không kết nối được máy chủ PHR."); throw e; } }
      return svc[name];
    }
  };
})();

function kysOf(tu, den) { const out = []; let y = +tu.slice(0, 4), m = +tu.slice(5, 7); const ey = +den.slice(0, 4), em = +den.slice(5, 7); while (y < ey || (y === ey && m <= em)) { out.push(y + "-" + String(m).padStart(2, "0")); m++; if (m > 12) { m = 1; y++; } if (out.length > 24) break; } return out; }

  // 4. khoán sửa chữa các hạng mục thường xuyên (công/xe × 250.000 đ)
  sc: [["Tháo rã cụm cầu, thay bạc đạn, canh chỉnh", 3], ["Tháo láp thay phốt đuôi cá cầu sau", 1], ["Tháo láp thay phốt bánh", 1.5], ["Tháo ráp nối khía trục láp dọc", 1.5], ["Tháo thay nhíp", 3], ["Tháo thay rotin lái", 2], ["Tháo thay bạc Ắc pi rê", 2.5], ["Tháo hộp số, thay đĩa ly hợp", 3.5], ["Tháo thay cao su ắc nhíp sau, trước", 2.5], ["Tháo thay cupben + điều chỉnh Amida", 1.5], ["Bảo dưỡng động cơ, thay lọc, xúc bô e, kiểm tra, châm nhớt cupben", 2], ["Tháo thay cầu, hộp số, bảo dưỡng bánh, điều chỉnh thắng, bảo dưỡng bánh", 2.5], ["Thay đĩa thùng, thay gỗ đà dọc", 3], ["Hàn gia cố thùng mủ tạp", 2.5], ["Tháo ráp két nước", 1], ["Điều chỉnh Amida", 1], ["Cắt xả hàn thay U 100 hai bên bửng + thay bản lề", 3.5], ["Cắt xả hàn thay tôn giá đỡ bình + hàn nắp tank", 1.5], ["Cắt xả hàn nâng cao hai hông bửng + hông bửng sau + hàn vá", 2.5], ["Thay bửng, bản lề + móc khóa bửng", 3.5], ["Tháo thay dây coroa + hàn khung tăng", 1.5]].map(([nd, cong]) => ({ nd, cong })),

/* ===== XUẤT BIỂU MẪU: HTML (xem trước/PDF), Excel, Word ===== */
function escH(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]); }
/* chức danh trong cùng hàng ký có cùng số dòng → tên người ký thẳng một hàng (vd. “KT. TỔNG GIÁM ĐỐC / PHÓ TỔNG GIÁM ĐỐC” 2 dòng) */
function signGroups(f) {
  return f.sign.map(g => { const L = g.map(k => f.signers[k] || { t: k, n: "" }), m = Math.max(1, ...L.map(s => String(s.t || "").split("\n").length));
    return L.map(s => { const t = String(s.t || "").split("\n"); while (t.length < m) t.push("\u00a0"); return Object.assign({}, s, { t: t.join("\n"), lines: m }); }); });
}

function paperHTML(f) {
  const P = f.P, tot = f.cols.reduce((a, b) => a + b, 0);
  const cg = f.cols.map(w => `<col style="width:${(w / tot * 100).toFixed(2)}%">`).join("");
  const rows = f.rows.map(r => `<tr class="r-${r.k}">${r.c.map(c => `<td${c.span ? ` colspan="${c.span}"` : ""} class="${c.al ? "a" + c.al : ""}${c.b ? " b" : ""}${c.i ? " i" : ""}">${escH(cellText(c))}</td>`).join("")}</tr>`).join("");
  const sign = `<div class="sgs">` + signGroups(f).map(g => `<div class="sg">${g.map(s => `<div><b>${escH(s.t).replace(/\n/g, "<br>")}</b><span class="sn">${escH(s.n)}</span></div>`).join("")}</div>`).join("") + `</div>`;
  return `<div class="paper ${f.orient}${f.small ? " small" : ""}">
  <div class="ph"><div><span class="cq">${escH(P.congTy)}</span><b class="ln3">${escH(f.dept)}</b></div><div><b>CỘNG HÒA XÃ HỘI CHỦ NGHĨA VIỆT NAM</b><b class="ln">Độc lập - Tự do - Hạnh phúc</b>${f.date ? `<i>${escH(vnDate(f.date, P))}</i>` : ""}</div></div>
  ${f.titles.map(t => `<div class="pt${t.s ? " s" : ""}">${escH(t.t)}</div>`).join("")}${f.titles.length ? `<div class="tln"></div>` : ""}
  ${f.pre.map(p => p.cols ? `<p class="tv"><span style="display:inline-block;width:46%;padding-left:1.5em;box-sizing:border-box;vertical-align:top">${escH(p.cols[0])}</span><span style="display:inline-block;width:54%;vertical-align:top">${escH(p.cols[1])}</span></p>` : `<p class="${p.b ? "b" : ""}${p.i ? " i" : ""}">${escH(p.t)}</p>`).join("")}
  <table class="pg${f.fixed ? " fx" : ""}"${f.fsk && f.fsk < 1 ? ` style="font-size:${((f.small ? 11 : 13) * f.fsk).toFixed(2)}px"` : ""}><colgroup>${cg}</colgroup><tbody>${rows}</tbody></table>
  ${f.post.map(p => `<p class="${p.b ? "b" : ""}${p.i ? " i" : ""}">${escH(p.t)}</p>`).join("")}
  ${sign}</div>`;
}

function curView() { const v = location.hash.slice(1); const vs = viewsFor(); return vs.includes(v) ? v : vs[0]; }
function bindCommon() {
  const k = $("#ky"); if (k) k.onchange = () => { if (!k.value) return; S.ky = k.value; S.nh.date = null; subKy(); render(); };
  $$("[data-unit]").forEach(b => b.onclick = () => { if (unit() === b.dataset.unit) return; S.unit = b.dataset.unit; try { localStorage.setItem("phr_sx_unit", S.unit); } catch (_) { }
    if (S.nh && S.nh.ms && (S.nh.ms === "__chung" ? S.unit === "PE" : !inUnit(S.nh.ms))) S.nh.ms = ""; S.slTo = null; S.slOpen = null; S.dv = null; S._view = null; render(); window.scrollTo(0, 0); });
}

function render() {
  const root = $("#root");
  if (S.fatal) { root.innerHTML = `<div class="main"><div class="card empty"><b>Không kết nối được dữ liệu dùng chung</b>${h(S.fatal)}</div></div>`; return; }
  if (!S.cfg) {
    root.innerHTML = shell(`<div class="card empty"><b>${S.loaded["config/main"] ? "Chưa có danh mục" : "Đang tải danh mục…"}</b>${S.loaded["config/main"] ? "Phòng PT&QLKCN cần khởi tạo danh mục đơn giá, nhân sự và xe." : (S.slow ? "Mạng chậm hoặc chưa kết nối được. Dữ liệu sẽ hiện khi kết nối lại." : "")}</div>`);
    return;
  }
  const v = curView();
  const lk = locked() + "|" + role();
  if (v === "nhap" && S._view === "nhap" && $("#nh-form") && S._lk === lk) { refreshNhap(); return; }
  S._lk = lk;
  S._view = v;
  const fn = { nhap: vNhap, duyet: vDuyet, "san-luong": vSanLuong, "theo-ngay": vTheoNgay, "ky-luong": vKyLuong, "danh-muc": vDanhMuc, "lich-su": vLichSu, "dinh-muc-nc": vDmNc, "sua-chua": vSuaChua, "nhien-lieu": vNhienLieu, "noi-dung-khac": vKhac }[v];
  root.innerHTML = shell(fn());
  bindCommon();
  ({ nhap: bNhap, duyet: bDuyet, "san-luong": bSanLuong, "theo-ngay": bTheoNgay, "ky-luong": bKyLuong, "danh-muc": bDanhMuc, "lich-su": bLichSu, "dinh-muc-nc": () => { }, "sua-chua": () => { }, "nhien-lieu": () => { const b = $("#kv-xls"); if (b) b.onclick = kvXls; }, "noi-dung-khac": () => { } })[v]();
  resolveNames();
}
window.addEventListener("hashchange", () => { S._view = null; render(); window.scrollTo(0, 0); });

function staffOptions(sel) {
  const groups = S.cfg.to.filter(t => (t.ma !== "TV" || S.staff.some(s => s.to === "TV")) && unitTos().includes(t.ma));
  return `<option value="">— Chọn ${unit() === "PE" ? "công nhân xưởng PE" : "công nhân"} —</option>${unit() === "DX" ? `<option value="__chung" ${sel === "__chung" ? "selected" : ""}>Khoản chung (không gắn công nhân)</option>` : ""}` + groups.map(t => {
    const ps = S.staff.filter(s => s.to === t.ma && s.tt !== "Nghỉ"); if (!ps.length) return "";
    return `<optgroup label="${h(t.ten)}">${ps.map(s => `<option value="${h(s.ms)}" ${s.ms === sel ? "selected" : ""}>${h(s.ten)} · ${h(s.ms)}${s.xe ? " · xe " + h(s.xe) : ""}</option>`).join("")}</optgroup>`;
  }).join("");
}
function vNhap() {

  ${!canEnter() ? `<div class="banner warn">Tài khoản này chỉ xem được. Nhờ Phòng PT&QLKCN cấp quyền Contributor để nhập.</div>` : ""}

const TEAM_TO = ["RX", "CK", "PE"], TEAM_NG = [["P", "Phép"], ["Ô", "Ốm"], ["R", "Việc riêng"], ["K", "Không lương"], ["L", "Lễ"]];

const IMP = [["ngay", "Ngày", ["ngay", "ngayvanchuyen", "date"]], ["phieu", "Số phiếu cân / mã chuyến", ["sophieu", "phieu", "sophieucan", "machuyen", "sophieucanmachuyen"]], ["xe", "Mã xe", ["maxe", "xe", "soxe"]],
  ["ms", "MSNV lái xe (để trống = lái chính)", ["msnv", "msnvlaixe", "msnvlaixedetrong", "malaixe"]], ["nguon", "Nguồn (Đội SX / Nhà máy)", ["nguon", "doisx", "doi", "nguondoisxnhamay"]], ["nm", "Nhà máy nhận", ["nhamay", "nhamaynhan"]],
  ["loai", "Loại (Mủ nước / Mủ tạp / Vận chuyển khác)", ["loai", "loaimu", "loaivanchuyen"]], ["kg", "Khối lượng (kg)", ["khoiluong", "kg", "khoiluongkg"]], ["cong", "Số công", ["socong", "cong"]], ["note", "Ghi chú", ["ghichu", "note"]]];

function bkParseRows(rows) {

    if (!H) { const i = c.findIndex(x => /ma nhan vien|staff code|^msnv$|^ma nv/.test(norm(x))), j = c.findIndex(x => /tai khoan|account|so tk/.test(norm(x))); if (i >= 0 && j >= 0) { H = { ms: i, tk: j, ten: c.findIndex(x => /ten nguoi|ho va ten|ho ten|beneficiary$|name/.test(norm(x))), nh: c.findIndex(x => /ngan hang|bank/.test(norm(x)) && !/tai khoan/.test(norm(x))) }; return; } }
    let ms = "", tk = "", ten = "", nh = "";
    if (H) { ms = (c[H.ms] || "").replace(/\D/g, ""); tk = (c[H.tk] || "").replace(/[\s.]/g, ""); ten = H.ten >= 0 ? c[H.ten] || "" : ""; nh = H.nh >= 0 ? c[H.nh] || "" : ""; }
    else {   // dòng dán từ PDF: STT  MSNV  ...  TÊN  SỐ TIỀN  SỐ TK  NGÂN HÀNG

      tk = ((line.match(/(?:^|\s)(\d{9,20})(?=\s|$)/) || [])[1] || "");
      nh = ((line.match(/(NG[AÂ]N H[AÀ]NG.*|NH\s.*|VIETINBANK.*|AGRIBANK.*|SHB.*)$/i) || [])[1] || "").trim();
    }
    if (ms && !staffBy(ms) && staffBy(ms.padStart(5, "0"))) ms = ms.padStart(5, "0");
    if (/^\d{3,8}$/.test(ms) && /^\d{6,20}$/.test(tk)) out.push({ ms, tk, ten: ten.trim(), nh: nh.replace(/\s+/g, " ") });
  });
  return out;
}
